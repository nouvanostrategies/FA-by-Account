<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foreign Assistance Funding Tracker</title>
  <!-- Chart.js for data visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      max-width: 900px; 
      margin: 2rem auto; 
      padding: 0 1rem; 
      color: #333;
    }
    header {
      margin-bottom: 2rem;
    }
    h1 {
      margin-bottom: 0.5rem;
    }
    .controls { 
      display: flex; 
      gap: 1rem; 
      margin-bottom: 1.5rem; 
      align-items: center; 
    }
    button { 
      padding: 0.6rem 1.2rem; 
      font-size: 1rem; 
      background-color: #0066cc; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      cursor: pointer; 
      transition: background-color 0.2s ease;
    }
    button:hover { 
      background-color: #0052a3; 
    }
    .status-msg {
      font-size: 0.9rem;
      color: #666;
    }
    .chart-container {
      position: relative;
      width: 100%;
      min-height: 400px;
    }
    canvas { 
      max-width: 100%; 
    }
  </style>
</head>
<body>

  <header>
    <h1>Foreign Assistance Funding Tracker</h1>
    <p>Custom charts generated from local <code>data.json</code> snapshot.</p>
  </header>
  
  <div class="controls">
    <button onclick="fetchDataAndRender()">Reload Data</button>
    <span id="status" class="status-msg">Loading data...</span>
  </div>

  <div class="chart-container">
    <canvas id="fundingChart"></canvas>
  </div>

  <script>
    let chartInstance = null;

    async function fetchDataAndRender() {
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Loading local data.json...';

      try {
        // Fetch the data.json file generated by your GitHub Action
        const response = await fetch('./data.json');
        
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const result = await response.json();
        console.log("Loaded local data successfully:", result);

        // Standardize output in case payload is wrapped inside an object
        const dataList = Array.isArray(result) ? result : (result.data || []);

        if (dataList.length === 0) {
          statusEl.textContent = 'No records found in data.json.';
          return;
        }

        // Aggregate monetary totals by Funding Account Name
        const accountTotals = {};

        dataList.forEach(item => {
          const account = item.funding_account_name || item.account_name || 'Unknown Account';
          const amount = parseFloat(item.transaction_amount || item.obligation_amount || item.current_amount || 0);
          
          accountTotals[account] = (accountTotals[account] || 0) + amount;
        });

        // Sort accounts from highest to lowest and select the top 10
        const sortedAccounts = Object.entries(accountTotals)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 10);

        const labels = sortedAccounts.map(entry => entry[0]);
        const values = sortedAccounts.map(entry => entry[1]);

        renderChart(labels, values);
        statusEl.textContent = `Showing top accounts (${dataList.length} total records loaded).`;

      } catch (err) {
        statusEl.textContent = 'Failed to load data.json.';
        console.error("Failed to load local data.json:", err);
        alert('Could not load data.json. Verify that your GitHub Action has run and created the data.json file in your repository root.');
      }
    }

    function renderChart(labels, values) {
      const ctx = document.getElementById('fundingChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Total Funding (USD)',
            data: values,
            backgroundColor: 'rgba(54, 162, 235, 0.6)',
            borderColor: 'rgba(54, 162, 235, 1)',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: { 
            title: { 
              display: true, 
              text: 'Top Foreign Assistance Accounts' 
            },
            legend: {
              display: true
            }
          },
          scales: { 
            y: { 
              beginAtZero: true,
              ticks: {
                // Formats numbers as formatted currency (e.g., $1,000,000)
                callback: function(value) {
                  return '$' + value.toLocaleString();
                }
              }
            },
            x: {
              ticks: {
                autoSkip: false,
                maxRotation: 45,
                minRotation: 0
              }
            }
          }
        }
      });
    }

    // Run automatically as soon as the DOM page finishes rendering
    window.addEventListener('DOMContentLoaded', fetchDataAndRender);
  </script>
</body>
</html>
