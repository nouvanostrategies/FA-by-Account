<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foreign Assistance Funding Tracker</title>
  <!-- Chart.js for data visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      max-width: 900px; 
      margin: 2rem auto; 
      padding: 0 1rem; 
      color: #333;
    }
    header {
      margin-bottom: 1.5rem;
    }
    .controls { 
      display: flex; 
      gap: 1rem; 
      margin-bottom: 1.5rem; 
      align-items: center; 
      background: #f4f6f8;
      padding: 1rem;
      border-radius: 6px;
    }
    select { 
      padding: 0.5rem 1rem; 
      font-size: 1rem; 
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: white;
      cursor: pointer;
    }
    .status-msg {
      font-size: 0.9rem;
      color: #666;
    }
    .chart-container {
      position: relative;
      width: 100%;
      min-height: 400px;
    }
    canvas { 
      max-width: 100%; 
    }
  </style>
</head>
<body>

  <header>
    <h1>Foreign Assistance Funding Tracker</h1>
    <p>Custom charts generated by fiscal year from ForeignAssistance.gov data.</p>
  </header>
  
  <div class="controls">
    <label for="yearSelect"><strong>Select Fiscal Year:</strong></label>
    <select id="yearSelect" onchange="fetchDataAndRender()">
      <option value="2026">2026</option>
      <option value="2025">2025</option>
      <option value="2024" selected>2024</option>
      <option value="2023">2023</option>
      <option value="2022">2022</option>
    </select>

    <span id="status" class="status-msg"></span>
  </div>

  <div class="chart-container">
    <canvas id="fundingChart"></canvas>
  </div>

  <script>
    let chartInstance = null;

    async function fetchDataAndRender() {
      const selectedYear = document.getElementById('yearSelect').value;
      const statusEl = document.getElementById('status');
      
      statusEl.textContent = `Loading data for ${selectedYear}...`;

      try {
        // Fetch the corresponding year's JSON file
        const response = await fetch(`./data-${selectedYear}.json`);
        
        if (!response.ok) {
          // Fallback if data-[YEAR].json doesn't exist yet
          if (selectedYear === '2024') {
            const fallbackResponse = await fetch('./data.json');
            if (fallbackResponse.ok) {
              const fallbackData = await fallbackResponse.json();
              processAndRender(fallbackData, selectedYear, statusEl);
              return;
            }
          }
          throw new Error(`File ./data-${selectedYear}.json not found on server.`);
        }

        const result = await response.json();
        processAndRender(result, selectedYear, statusEl);

      } catch (err) {
        statusEl.textContent = `Could not load FY ${selectedYear} data. Make sure GitHub Actions ran.`;
        console.error(err);
      }
    }

    function processAndRender(result, year, statusEl) {
      const dataList = Array.isArray(result) ? result : (result.data || []);

      if (dataList.length === 0) {
        statusEl.textContent = `No records found for ${year}.`;
        return;
      }

      // Aggregate totals by funding account name
      const accountTotals = {};
      dataList.forEach(item => {
        const account = item.funding_account_name || item.account_name || 'Unknown Account';
        const amount = parseFloat(item.transaction_amount || item.obligation_amount || item.current_amount || 0);
        accountTotals[account] = (accountTotals[account] || 0) + amount;
      });

      // Get top 10 accounts
      const sortedAccounts = Object.entries(accountTotals)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

      const labels = sortedAccounts.map(entry => entry[0]);
      const values = sortedAccounts.map(entry => entry[1]);

      renderChart(labels, values, year);
      statusEl.textContent = `Loaded ${dataList.length} records for FY ${year}.`;
    }

    function renderChart(labels, values, year) {
      const ctx = document.getElementById('fundingChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Total Funding (USD)',
            data: values,
            backgroundColor: 'rgba(54, 162, 235, 0.6)',
            borderColor: 'rgba(54, 162, 235, 1)',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: { 
            title: { 
              display: true, 
              text: `Top Foreign Assistance Accounts (${year})` 
            }
          },
          scales: { 
            y: { 
              beginAtZero: true,
              ticks: {
                callback: function(value) {
                  return '$' + value.toLocaleString();
                }
              }
            },
            x: {
              ticks: {
                autoSkip: false,
                maxRotation: 45,
                minRotation: 0
              }
            }
          }
        }
      });
    }

    // Load initial year on DOM ready
    window.addEventListener('DOMContentLoaded', fetchDataAndRender);
  </script>
</body>
</html>
