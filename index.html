<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foreign Assistance Funding Tracker</title>
  <!-- Chart.js for visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      max-width: 900px; 
      margin: 2rem auto; 
      padding: 0 1rem; 
      color: #333;
    }
    header {
      margin-bottom: 1.5rem;
    }
    .controls { 
      display: flex; 
      gap: 1rem; 
      margin-bottom: 1.5rem; 
      align-items: center; 
      background: #f4f6f8;
      padding: 1rem;
      border-radius: 6px;
    }
    select { 
      padding: 0.5rem 1rem; 
      font-size: 1rem; 
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: white;
      cursor: pointer;
    }
    .status-msg {
      font-size: 0.9rem;
      font-weight: 500;
    }
    .chart-container {
      position: relative;
      width: 100%;
      min-height: 400px;
    }
    canvas { 
      max-width: 100%; 
    }
    #debugOutput {
      margin-top: 1.5rem;
    }
    pre {
      background: #f0f0f0;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Foreign Assistance Funding Tracker</h1>
    <p>Custom charts generated by fiscal year from ForeignAssistance.gov data.</p>
  </header>
  
  <div class="controls">
    <label for="yearSelect"><strong>Select Fiscal Year:</strong></label>
    <select id="yearSelect" onchange="fetchDataAndRender()">
      <option value="2026">2026</option>
      <option value="2025">2025</option>
      <option value="2024" selected>2024</option>
      <option value="2023">2023</option>
      <option value="2022">2022</option>
    </select>

    <span id="status" class="status-msg"></span>
  </div>

  <div class="chart-container">
    <canvas id="fundingChart"></canvas>
  </div>

  <div id="debugOutput"></div>

  <script>
    let chartInstance = null;

    async function fetchDataAndRender() {
      const selectedYear = document.getElementById('yearSelect').value;
      const statusEl = document.getElementById('status');
      const debugEl = document.getElementById('debugOutput');
      
      statusEl.style.color = '#666';
      statusEl.textContent = `Loading data for FY ${selectedYear}...`;
      if (debugEl) debugEl.innerHTML = '';

      try {
        // Fetch the selected year's JSON file (with fallback to data.json for 2024)
        let response = await fetch(`./data-${selectedYear}.json`);
        
        if (!response.ok && selectedYear === '2024') {
          response = await fetch('./data.json');
        }

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ./data-${selectedYear}.json file not found on server.`);
        }

        // Read as plain text first to safely prevent SyntaxError JSON crashes on 0-byte/empty files
        const text = await response.text();
        if (!text || text.trim().length === 0) {
          throw new Error(`data-${selectedYear}.json is empty. Run the GitHub Action workflow to populate it.`);
        }

        // Safely parse JSON after verifying the string is non-empty
        const rawData = JSON.parse(text);
        console.log("Loaded raw data successfully:", rawData);

        // Check if file contains API Error payload
        if (rawData.API_Error_Log || rawData.error || rawData.message) {
          statusEl.style.color = '#d9534f';
          statusEl.textContent = `API error payload saved inside data-${selectedYear}.json.`;
          if (debugEl) {
            debugEl.innerHTML = `<p><strong>File Contents:</strong></p><pre>${JSON.stringify(rawData, null, 2)}</pre>`;
          }
          if (chartInstance) chartInstance.destroy();
          return;
        }

        // Standardize list extraction across various API output wrappers
        let dataList = [];
        if (Array.isArray(rawData)) {
          dataList = rawData;
        } else if (rawData.data && Array.isArray(rawData.data)) {
          dataList = rawData.data;
        } else if (rawData.results && Array.isArray(rawData.results)) {
          dataList = rawData.results;
        } else if (rawData.financials && Array.isArray(rawData.financials)) {
          dataList = rawData.financials;
        }

        if (dataList.length === 0) {
          statusEl.style.color = '#d9534f';
          statusEl.textContent = `No valid record array found inside data-${selectedYear}.json.`;
          if (debugEl) {
            debugEl.innerHTML = `<p><strong>Received JSON structure:</strong></p><pre>${JSON.stringify(rawData, null, 2)}</pre>`;
          }
          if (chartInstance) chartInstance.destroy();
          return;
        }

        // Aggregate amounts by account name flexible key matching
        const accountTotals = {};
        dataList.forEach(item => {
          const account = item.funding_account_name || item.account_name || item.funding_agency_name || item.operating_unit || 'Other Accounts';
          const amount = parseFloat(item.transaction_amount || item.obligation_amount || item.current_amount || item.amount || 0);
          
          if (amount > 0) {
            accountTotals[account] = (accountTotals[account] || 0) + amount;
          }
        });

        // Extract top 10 accounts by value
        const sortedAccounts = Object.entries(accountTotals)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 10);

        if (sortedAccounts.length === 0) {
          statusEl.style.color = '#d9534f';
          statusEl.textContent = `Records loaded, but no positive dollar amounts found for FY ${selectedYear}.`;
          if (chartInstance) chartInstance.destroy();
          return;
        }

        const labels = sortedAccounts.map(entry => entry[0]);
        const values = sortedAccounts.map(entry => entry[1]);

        renderChart(labels, values, selectedYear);
        statusEl.style.color = '#2e7d32';
        statusEl.textContent = `Successfully rendered FY ${selectedYear} (${dataList.length} total records loaded).`;

      } catch (err) {
        statusEl.style.color = '#d9534f';
        statusEl.textContent = `Error: ${err.message}`;
        console.error("Fetch/Render error:", err);
        if (chartInstance) chartInstance.destroy();
      }
    }

    function renderChart(labels, values, year) {
      const ctx = document.getElementById('fundingChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Total Funding (USD)',
            data: values,
            backgroundColor: 'rgba(54, 162, 235, 0.6)',
            borderColor: 'rgba(54, 162, 235, 1)',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: { 
            title: { 
              display: true, 
              text: `Top Foreign Assistance Accounts (${year})` 
            }
          },
          scales: { 
            y: { 
              beginAtZero: true,
              ticks: {
                callback: function(value) {
                  return '$' + value.toLocaleString();
                }
              }
            },
            x: {
              ticks: {
                autoSkip: false,
                maxRotation: 45,
                minRotation: 0
              }
            }
          }
        }
      });
    }

    // Load initial year on DOM ready
    window.addEventListener('DOMContentLoaded', fetchDataAndRender);
  </script>
</body>
</html>
