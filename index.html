<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foreign Assistance Funding Tracker</title>
  <!-- Chart.js for visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      max-width: 900px; 
      margin: 2rem auto; 
      padding: 0 1rem; 
      color: #333;
    }
    .controls { 
      display: flex; 
      gap: 1rem; 
      margin-bottom: 1.5rem; 
      align-items: center; 
    }
    button { 
      padding: 0.6rem 1.2rem; 
      font-size: 1rem; 
      background-color: #0066cc; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      cursor: pointer; 
    }
    button:hover { 
      background-color: #0052a3; 
    }
    .status-msg {
      font-size: 0.9rem;
      color: #666;
    }
    canvas { 
      max-width: 100%; 
      height: 400px; 
    }
  </style>
</head>
<body>

  <h1>Foreign Assistance Funding by Account</h1>
  
  <div class="controls">
    <button onclick="fetchDataAndRender()">Load Funding Data</button>
    <span id="status" class="status-msg"></span>
  </div>

  <canvas id="fundingChart"></canvas>

  <script>
    let chartInstance = null;

    async function fetchDataAndRender() {
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Loading local dataset...';

      try {
        // Fetch from the local data.json created by GitHub Actions
        const response = await fetch('./data.json');
        
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const result = await response.json();
        console.log("Loaded local data successfully:", result);

        // Adjust for API wrappers (handles array vs object response structures)
        const dataList = Array.isArray(result) ? result : (result.data || []);

        if (dataList.length === 0) {
          statusEl.textContent = 'No records found in data.json.';
          return;
        }

        // Group amounts by Funding Account Name
        const accountTotals = {};

        dataList.forEach(item => {
          const account = item.funding_account_name || 'Unknown Account';
          const amount = parseFloat(item.transaction_amount || item.obligation_amount || item.current_amount || 0);
          
          accountTotals[account] = (accountTotals[account] || 0) + amount;
        });

        // Extract top 10 accounts by total amount
        const sortedAccounts = Object.entries(accountTotals)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 10);

        const labels = sortedAccounts.map(entry => entry[0]);
        const values = sortedAccounts.map(entry => entry[1]);

        renderChart(labels, values);
        statusEl.textContent = `Successfully rendered ${dataList.length} records!`;

      } catch (err) {
        statusEl.textContent = 'Failed to load local data.';
        console.error("Failed to load local data.json:", err);
        alert('Could not load data.json. Make sure the GitHub Action workflow has run successfully at least once.');
      }
    }

    function renderChart(labels, values) {
      const ctx = document.getElementById('fundingChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Total Funding Amount (USD)',
            data: values,
            backgroundColor: 'rgba(54, 162, 235, 0.6)',
            borderColor: 'rgba(54, 162, 235, 1)',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: { 
            title: { 
              display: true, 
              text: 'Top 10 Foreign Assistance Funding Accounts (2024)' 
            } 
          },
          scales: { 
            y: { 
              beginAtZero: true,
              ticks: {
                // Format numbers as currency in millions/billions
                callback: function(value) {
                  return '$' + value.toLocaleString();
                }
              }
            } 
          }
        }
      });
    }

    // Automatically load data when page finishes loading
    window.addEventListener('DOMContentLoaded', fetchDataAndRender);
  </script>
</body>
</html>
