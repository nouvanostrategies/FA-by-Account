name: Fetch Foreign Assistance Data Daily

on:
  schedule:
    # Runs automatically at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Allows manual triggers from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Multi-Year API Data
        run: |
          # Download JSON datasets from 2022 through 2026
          curl -s "https://foreignassistance.gov/api/v1/financials?fiscal_year=2026&page_size=250" -o data-2026.json
          curl -s "https://foreignassistance.gov/api/v1/financials?fiscal_year=2025&page_size=250" -o data-2025.json
          curl -s "https://foreignassistance.gov/api/v1/financials?fiscal_year=2024&page_size=250" -o data-2024.json
          curl -s "https://foreignassistance.gov/api/v1/financials?fiscal_year=2023&page_size=250" -o data-2023.json
          curl -s "https://foreignassistance.gov/api/v1/financials?fiscal_year=2022&page_size=250" -o data-2022.json

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data-*.json
          
          # Only commit if data files changed
          if git diff --staged --quiet; then
            echo "No changes in API data."
          else
            git commit -m "chore: update multi-year json datasets (2022-2026) [skip ci]"
            git push
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
