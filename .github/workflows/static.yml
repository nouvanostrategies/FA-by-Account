name: Fetch Foreign Assistance Data Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Multi-Year API Data safely
        run: |
          fetch_year () {
            YEAR=$1
            OUT_FILE="data-${YEAR}.json"
            TEMP_FILE="temp-${YEAR}.json"
            
            # Fetch using --location and --fail
            if curl -sL --fail "https://foreignassistance.gov/api/v1/financials?fiscal_year=${YEAR}&page_size=250" -o "$TEMP_FILE"; then
              # Only overwrite if non-empty and valid JSON
              if [ -s "$TEMP_FILE" ] && jq . "$TEMP_FILE" >/dev/null 2>&1; then
                mv "$TEMP_FILE" "$OUT_FILE"
                echo "Successfully updated $OUT_FILE"
              else
                echo "Warning: Received invalid/empty JSON for $YEAR. Skipping update."
                rm -f "$TEMP_FILE"
              fi
            else
              echo "Warning: Failed to download data for $YEAR. Keeping existing file."
              rm -f "$TEMP_FILE"
            fi
          }

          fetch_year 2026
          fetch_year 2025
          fetch_year 2024
          fetch_year 2023
          fetch_year 2022

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data-*.json
          
          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "chore: update foreign assistance data JSON files [skip ci]"
            git push
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
